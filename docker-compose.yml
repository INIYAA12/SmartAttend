# NOTE: written for deployment but not run in the development sandbox.
# Start:  docker compose up --build        then open http://localhost:8080
services:
  app:
    build: .
    environment:
      - APP_ENV=production
      - AUTO_SEED_DEMO=0
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      - SESSION_COOKIE_SECURE=0          # set to 1 once nginx terminates HTTPS
    volumes:
      - app_data:/app/database           # SQLite database (WAL)
      - app_faces:/app/data/faces        # face embeddings -- biometric data, protect this volume
      - app_models:/app/models
      - app_logs:/app/logs
    # Linux only: expose the webcam to the container.
    # devices: ["/dev/video0:/dev/video0"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    restart: unless-stopped

volumes:
  app_data:
  app_faces:
  app_models:
  app_logs:
