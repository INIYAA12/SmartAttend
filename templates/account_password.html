{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h4 class="mb-3">Change Password</h4>
<div class="panel" style="max-width:420px;">
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-2"><label class="form-label">Current password</label><input type="password" name="current_password" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">New password (min 8 chars)</label><input type="password" name="new_password" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" name="confirm_password" class="form-control" required></div>
    <button class="btn btn-primary">Update password</button>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
