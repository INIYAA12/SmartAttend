{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h4 class="mb-3">User Accounts</h4>
<div class="row g-3">
  <div class="col-md-4">
    <div class="panel">
      <h6>Add User</h6>
      <form method="POST" action="{{ url_for('admin.add_user') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-2"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Password (min 8 chars)</label><input type="password" name="password" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Role</label><select name="role" class="form-select"><option value="teacher">Teacher</option><option value="admin">Admin</option></select></div>
        <button class="btn btn-primary w-100">Create User</button>
      </form>
    </div>
  </div>
  <div class="col-md-8">
    <div class="panel">
      <table class="table table-sm align-middle">
        <thead><tr><th>Username</th><th>Role</th><th>Created</th><th>Reset password</th><th></th></tr></thead>
        <tbody>
          {% for u in users %}
          <tr>
            <td>{{ u['username'] }}</td><td><span class="badge bg-secondary">{{ u['role'] }}</span></td><td>{{ u['created_at'][:10] }}</td>
            <td><form method="POST" action="{{ url_for('admin.reset_password', user_id=u['id']) }}" class="d-flex gap-1"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <input type="password" name="password" class="form-control form-control-sm" placeholder="new password" required>
                  <button class="btn btn-sm btn-outline-secondary">Reset</button></form></td>
            <td><form method="POST" action="{{ url_for('admin.delete_user', user_id=u['id']) }}" onsubmit="return confirm('Delete {{ u['username'] }}?');"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
